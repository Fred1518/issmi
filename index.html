<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il cervello sociale al comando — XXIX ISSMI</title>
<meta name="theme-color" content="#16324F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --navy:#16324F; --teal:#1F7A78; --gold:#8A6508; --gold-br:#B8860B;
  --paper:#FBFBF9; --ink:#14181C; --grey:#5A6672; --line:#D9DEE3;
  --tint:#F1F5F7; --warn:#7A2E2E;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16.5px; line-height:1.55; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 72px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;
}
.hd{max-width:640px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
.hd .ttl{font-family:var(--serif);font-size:16px;line-height:1.2;flex:1;min-width:0}
.hd .ttl small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.10em;
  text-transform:uppercase;color:#A9C2D6;margin-bottom:3px}
.langbtn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;background:transparent;
  color:#fff;border:1px solid #4E7292;border-radius:3px;padding:6px 9px;cursor:pointer}
.langbtn b{color:#fff}
.langbtn span{color:#7E9DB8}
.backbtn{font-family:var(--mono);font-size:12px;background:transparent;color:#A9C2D6;
  border:0;padding:6px 2px;cursor:pointer}

/* ---------- type ---------- */
h1{font-family:var(--serif);font-size:27px;line-height:1.2;margin:26px 0 8px;color:var(--navy);font-weight:normal}
h2{font-family:var(--serif);font-size:21px;line-height:1.25;margin:30px 0 8px;color:var(--navy);font-weight:normal}
h3{font-size:15px;margin:22px 0 6px;color:var(--teal);letter-spacing:.01em}
p{margin:0 0 12px}
.lede{color:var(--grey);font-size:15.5px;margin-bottom:18px}
.small{font-size:14px;color:var(--grey)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--teal);margin:0 0 6px}
.tag{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap}
.tag.c{color:var(--teal)} .tag.h{color:var(--grey)}
.hr{height:1px;background:var(--line);margin:26px 0}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:5px;padding:16px 16px 14px;margin:0 0 14px}
.card.tint{background:var(--tint);border-color:#CCD8DF}
.card h3{margin-top:0}
.note{background:var(--tint);border:1px solid #CCD8DF;border-radius:5px;padding:12px 14px;
  font-size:14.5px;color:#2C3D4C;margin:0 0 16px}
.note b{color:var(--navy)}

/* ---------- index list ---------- */
.idx{list-style:none;margin:0;padding:0}
.idx li{border-top:1px solid var(--line)}
.idx li:last-child{border-bottom:1px solid var(--line)}
.idx a{display:flex;gap:14px;align-items:baseline;padding:15px 2px;text-decoration:none;color:var(--ink)}
.idx .m{font-family:var(--mono);font-size:11.5px;color:var(--teal);width:34px;flex:none;letter-spacing:.04em}
.idx .n{flex:1;font-family:var(--serif);font-size:17.5px;color:var(--navy)}
.idx .n em{display:block;font-family:var(--sans);font-style:normal;font-size:13.5px;color:var(--grey);margin-top:2px}
.idx .st{font-family:var(--mono);font-size:11px;color:var(--grey);flex:none}
.idx .st.ok{color:var(--teal)}

/* ---------- controls ---------- */
button,input,textarea,select{font-family:inherit;font-size:16px}
.btn{display:block;width:100%;background:var(--navy);color:#fff;border:0;border-radius:4px;
  padding:14px 16px;cursor:pointer;font-size:16px;margin:16px 0 0;text-align:center}
.btn:disabled{background:#9AA7B2;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:10px 14px;font-size:14.5px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:13px 14px;margin:0 0 9px;cursor:pointer;line-height:1.45;color:var(--ink)}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--navy);border-width:2px;padding:12px 13px;background:var(--tint)}
.opt .k{font-family:var(--mono);font-size:11.5px;color:var(--teal);display:block;margin-bottom:3px;
  letter-spacing:.08em;text-transform:uppercase}
.opt.right{border-color:var(--teal);background:#EEF6F5}
.opt.wrong{border-color:#C9A9A9;background:#FAF2F2}
input[type=number],input[type=text],textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:4px;background:#fff}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--teal)}
.slabel{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--grey);margin-top:2px}
.sval{font-family:var(--mono);font-size:22px;color:var(--navy);text-align:center;margin:6px 0 0}

/* likert */
.lk{display:flex;gap:6px;margin-top:8px}
.lk button{flex:1;padding:11px 0;border:1px solid var(--line);background:#fff;border-radius:4px;
  font-family:var(--mono);font-size:14px;color:var(--grey);cursor:pointer}
.lk button.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.lkends{display:flex;justify-content:space-between;font-size:12px;color:var(--grey);margin-top:5px}

/* ranked bars */
.rank{margin:14px 0 0}
.rank .row{margin:0 0 11px}
.rank .rl{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;margin-bottom:4px}
.rank .rl b{font-weight:600;color:var(--navy)}
.rank .rl span{font-family:var(--mono);font-size:12px;color:var(--grey)}
.rank .bar{height:9px;background:#E7ECEF;border-radius:2px;overflow:hidden}
.rank .fill{height:100%;background:var(--teal)}
.rank .row.top .fill{background:var(--navy)}

/* progress */
.prog{font-family:var(--mono);font-size:11.5px;color:var(--grey);letter-spacing:.08em;margin:0 0 14px}
.dossier{border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:0 0 14px}
.dossier .dh{background:var(--navy);color:#fff;padding:9px 14px;font-family:var(--mono);
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.dossier .db{padding:13px 14px;background:#fff}
.dossier ul{margin:0;padding-left:18px}
.dossier li{margin-bottom:6px;font-size:15px}
.sys{border:1px solid var(--gold-br);border-radius:5px;margin:0 0 14px;overflow:hidden}
.sys .dh{background:#F6EEDC;color:#5C4406;padding:9px 14px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase}
.sys .db{padding:13px 14px;background:#FDFAF3;font-size:15px}
.sys .score{font-family:var(--mono);font-size:15px;color:var(--navy);margin:6px 0}
.sys .fine{font-size:12.5px;color:var(--grey);margin-top:9px;line-height:1.45}

.ex{background:var(--tint);border:1px solid #CCD8DF;border-radius:4px;padding:11px 13px;margin:12px 0 0;font-size:14px;line-height:1.5;color:#2C3D4C}
.ex p{margin:0 0 6px}
.ex b{color:var(--navy)}
.qa{margin:0 0 6px;font-size:15px}
.qa dt{font-family:var(--serif);color:var(--navy);font-size:16px;margin-top:14px}
.qa dd{margin:3px 0 0;color:#25313C}
.refl{list-style:none;padding:0;margin:0}
.refl li{font-size:13.5px;color:#2C3D4C;padding:8px 0;border-top:1px solid var(--line);line-height:1.45}
footer{margin:34px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--grey)}
.fade{animation:f .22s ease-out}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style>
</head>

/* ============================================================

var app=document.getElementById("app");
var route="home";
function go(r){route=r;window.scrollTo(0,0);render();}
document.getElementById("back").onclick=function(){go("home");};
document.getElementById("lang").onclick=function(){
  S.lang=(S.lang==="it")?"en":"it";save();
  document.documentElement.lang=S.lang;render();
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function done(id){
  if(id==="t0") return S.t0 && S.t0.pick;
  if(id==="t1") return Object.keys(S.t1).length===6;
  if(id==="sc") return Object.keys(S.sa).length===10;
  if(id==="t3") return Object.keys(S.t3).some(function(k){var v=S.t3[k]||{};return v.q&&v.a;});
  return false;
}

function render(){
  document.getElementById("hsup").textContent=L(UI.sup);
  document.getElementById("htitle").textContent=L(UI.title);
  document.getElementById("lang").innerHTML = S.lang==="it" ? "<b>IT</b><span> / EN</span>" : "<span>IT / </span><b>EN</b>";
  document.getElementById("back").hidden = (route==="home");
  document.getElementById("foot").innerHTML =
    L(UI.foot)+"<br><br><button class='btn ghost sm' id='rst'>"+L(UI.reset)+"</button>";
  var h="";
  if(route==="home") h=vHome();
  else if(route==="t0") h=vT0();
  else if(route==="t1") h=vT1();
  else if(route==="sc") h=vSC();
  else if(route==="t2") h=vT2();
  else if(route==="t3") h=vT3();
  else if(route==="rf") h=vRF();
  app.className="fade"; app.innerHTML=h;
  bind();
  document.getElementById("rst").onclick=function(){
    if(confirm(L(UI.resetok))){localStorage.removeItem(KEY);
      S={lang:S.lang,cond:null,day:null,t0:{},t1:{},sa:{},sb:{},sc:{},t3:{},t3pick:null};go("home");}
  };
}

/* ---- home ---- */
function vHome(){
  var h="<h1>"+L(UI.title)+"</h1><p class='lede'>"+L(UI.sub)+"</p>";
  h+="<p class='small' style='margin-top:-8px'>"+L(UI.teacher)+"</p>";
  h+="<div class='note'>"+L(UI.privacy)+"</div>";
  h+="<ul class='idx'>";
  SEC.forEach(function(s){
    var ok=done(s.id);
    h+="<li><a href='#' data-go='"+s.id+"'><span class='m'>"+s.m+"</span>"+
       "<span class='n'>"+L(s.n)+"<em>"+L(s.d)+"</em></span>"+
       "<span class='st"+(ok?" ok":"")+"'>"+(ok?"✓":"›")+"</span></a></li>";
  });
  h+="</ul>";
  h+="<div class='note' style='margin-top:20px'>"+L(RF.legend)+"</div>";
  return h;
}

function sysBox(){
  return "<div class='sys'><div class='dh'>"+L(T0.sysh)+"</div><div class='db'>"+

function slider(id,val,lo,hi){

/* ---- T1 ---- */
function vT1(){
  var h="<p class='eyebrow'>M1</p><h1>"+L(SEC[1].n)+"</h1><p class='lede'>"+L(T1.intro)+"</p>";
  var sc=L(T1.scale);
  L(T1.items).forEach(function(t,i){
    h+="<div class='card'><div>"+t+"</div><div class='lk'>";
    for(var v=1;v<=5;v++) h+="<button data-lk='"+i+"' data-v='"+v+"' class='"+(S.t1[i]===v?"sel":"")+"'>"+v+"</button>";
    h+="</div><div class='lkends'><span>"+sc[0]+"</span><span>"+sc[4]+"</span></div></div>";
  });
  if(Object.keys(S.t1).length===6){
    var tot=0;for(var k in S.t1)tot+=S.t1[k];
    var bands=L(T1.bands),b=bands[0];
    for(var i=0;i<bands.length;i++){if(tot<=bands[i].max){b=bands[i];break;}}
    h+="<div class='card tint'><p class='eyebrow'>"+L(T1.score)+" "+tot+"/30</p>"+
       "<h3 style='margin-top:0'>"+b.t+"</h3><p style='margin-bottom:0'>"+b.b+"</p></div>";
    h+="<div class='note'><span class='tag'>[probabile]</span> "+L(T1.caveat)+"</div>";
  }
  h+="<button class='btn ghost' data-go='home'>"+L(UI.home)+"</button>";
  return h;

/* ---- SCARF ---- */
function vSC(){
  var h="<p class='eyebrow'>M2</p><h1>"+L(SEC[2].n)+"</h1>";
  h+="<div class='note'><span class='tag h'>[ipotesi]</span> "+L(SC.intro)+"</div>";

  /* parte 1 */
  h+="<h2>"+L(SC.p1t)+"</h2><p class='lede'>"+L(SC.p1i)+"</p>";
  var n=Object.keys(S.sa).length;
  if(n<10){
    var i=n;var p=SC.pairs[i];
    h+="<p class='prog'>"+(i+1)+" / 10</p>";
    h+="<button class='opt' data-pair='"+i+"' data-d='"+p.a+"'>"+L(p.ta)+"</button>";
    h+="<button class='opt' data-pair='"+i+"' data-d='"+p.b+"'>"+L(p.tb)+"</button>";
    if(n>0) h+="<button class='btn ghost sm' id='undo'>"+L(UI.back)+"</button>";
  }else{
    h+=rankView();
    h+="<div class='note'>"+L(SC.p1c)+"</div><p>"+L(SC.p1u)+"</p>";
    h+="<button class='btn ghost sm' id='redo'>"+(S.lang==="it"?"Rifai le dieci coppie":"Redo the ten pairs")+"</button>";
  }

  /* parte 2 */
  h+="<div class='hr'></div><h2>"+L(SC.p2t)+"</h2><p class='lede'>"+L(SC.p2i)+"</p>";
  h+="<div class='dossier'><div class='dh'>"+L(SC.eventh)+"</div><div class='db'>"+L(SC.event)+"</div></div>";
  SC.q2.forEach(function(q,qi){
    var d=DOM[q.d],ans=S.sb[qi];
    h+="<div class='card'><h3 style='margin-top:0'>"+L(SC.ask)+" <b>"+L(d)+"</b>?</h3>";
    h+="<p class='small' style='margin-top:-2px'>"+(S.lang==="it"?d.di:d.de)+"</p>";
    q.opts.forEach(function(o,oi){
      var cls="opt";
      if(ans!=null){ cls += (o.k===q.d)?" right":(ans===oi?" wrong":""); }
      h+="<button class='"+cls+"' data-q2='"+qi+"' data-oi='"+oi+"'>";
      if(ans!=null) h+="<span class='k'>"+(o.k===q.d?L(SC.right):L(SC.belongs)+" "+L(DOM[o.k]))+"</span>";
      h+=L(o.t)+"</button>";
      if(ans!=null && (o.k===q.d||ans===oi)) h+="<p class='small' style='margin:-2px 0 12px 2px'>"+L(o.w)+"</p>";
    });
    h+="</div>";
  });
  if(Object.keys(S.sb).length===5) h+="<div class='note'>"+L(SC.p2c)+"</div>";

  /* parte 3 */
  h+="<div class='hr'></div><h2>"+L(SC.p3t)+"</h2><p class='lede'>"+L(SC.p3i)+"</p>";
  SC.q3.forEach(function(q,i){
    h+="<div class='card'><div>"+L(q.t)+"</div><div class='lk'>";

    h+="</div><div class='lkends'><span>"+L(SC.none)+"</span><span>"+L(SC.much)+"</span></div></div>";
  });
  if(Object.keys(S.sc).length<5){
    h+="<p class='prog'>"+(S.lang==="it"
      ?"Rispondi a tutte e cinque per vedere il quadro. ("+Object.keys(S.sc).length+" / 5)"

    var arr=SC.q3.map(function(q,i){return {k:q.k,v:S.sc[i]};}).sort(function(a,b){return b.v-a.v;});

  h+="<button class='btn ghost' data-go='home'>"+L(UI.home)+"</button>";
  return h;
}
function rankView(){
  var sc={S:0,C:0,A:0,R:0,F:0};
  for(var k in S.sa) sc[S.sa[k]]++;
  var arr=Object.keys(sc).map(function(k){return {k:k,v:sc[k]};}).sort(function(a,b){return b.v-a.v;});
  var h="<div class='card tint'><p class='eyebrow'>"+L(SC.p1r)+"</p><div class='rank'>";
  arr.forEach(function(x,i){
    h+="<div class='row"+(i===0?" top":"")+"'><div class='rl'><b>"+L(DOM[x.k])+"</b><span>"+x.v+"/4</span></div>"+
       "<div class='bar'><div class='fill' style='width:"+(x.v*25)+"%'></div></div>"+
       "<p class='small' style='margin:4px 0 0'>"+(S.lang==="it"?DOM[x.k].di:DOM[x.k].de)+"</p></div>";
  });
  return h+"</div></div>";
}

    var v=S.t3[i]||{};
    var isMine=(S.t3pick===String(i));
    h+="<div class='card"+(isMine?" tint":"")+"'><h3 style='margin-top:0'>"+L(it.t)+"</h3>";
    h+="<p class='eyebrow' style='margin:10px 0 2px'>"+L(T3.wh)+"</p><p class='small'>"+L(it.f)+"</p>";
    h+="<p class='eyebrow' style='margin:10px 0 2px'>"+L(T3.wn)+"</p><p class='small'>"+L(it.w)+"</p>";
    if(it.tag) h+="<p class='small'><span class='tag h'>["+(S.lang==="it"?"ipotesi":"hypothesis")+"]</span> "+L(it.tagtx)+"</p>";
    h+="<div class='ex'><p class='eyebrow' style='margin:0 0 4px'>"+L(T3.ex)+"</p>"+
       "<p><b>"+L(T3.fq)+"</b> "+L(it.eq)+"</p><p style='margin-bottom:0'><b>"+L(T3.fa)+"</b> "+L(it.ea)+"</p></div>";
    h+="<p class='eyebrow' style='margin:16px 0 3px'>"+L(T3.fq)+"</p>"+
       "<textarea data-t3='"+i+"' data-f='q' style='min-height:52px' placeholder='"+L(T3.phq)+"'>"+esc(v.q||"")+"</textarea>";
    h+="<p class='eyebrow' style='margin:12px 0 3px'>"+L(T3.fa)+"</p>"+
       "<textarea data-t3='"+i+"' data-f='a' placeholder='"+L(T3.pha)+"'>"+esc(v.a||"")+"</textarea>";
    h+="<button class='btn "+(isMine?"":"ghost ")+"sm' data-mark='"+i+"'>"+
       (isMine?"★ "+L(T3.marked):L(T3.mark))+"</button>";
    h+="</div>";
  });
  h+="<h2>"+L(T3.outh)+"</h2><p>"+L(T3.out)+"</p>";
  h+="<button class='btn' id='copy3'>"+L(T3.exp)+"</button>";
  h+="<p class='small' id='cmsg' style='text-align:center'></p>";
  h+="<div class='note' style='margin-top:20px'>"+L(T3.close)+"</div>";
  h+="<button class='btn ghost' data-go='home'>"+L(UI.home)+"</button>";
  return h;
}

/* ---- riferimenti ---- */
function vRF(){
  var h="<h1>"+L(SEC[5].n)+"</h1>";
  h+="<div class='note'>"+L(RF.legend)+"</div>";
  h+="<h2>"+(S.lang==="it"?"Glossario":"Glossary")+"</h2><dl class='qa'>";
  RF.gloss.forEach(function(g){
    var cl=g.tag==="certo"?"c":(g.tag==="ipotesi"?"h":"");
    var lb=S.lang==="it"?g.tag:(g.tag==="certo"?"certain":g.tag==="probabile"?"probable":"hypothesis");
    h+="<dt>"+L(g.t)+" <span class='tag "+cl+"'>["+lb+"]</span></dt><dd>"+L(g.d)+"</dd>";
  });
  h+="</dl>";
  h+="<div class='hr'></div><h2>"+L(RF.mythh)+"</h2><p class='lede'>"+L(RF.mythi)+"</p><dl class='qa'>";
  RF.myths.forEach(function(m){h+="<dt>"+L(m.t)+"</dt><dd>"+L(m.d)+"</dd>";});
  h+="</dl>";
  h+="<div class='hr'></div><h2>"+L(RF.refh)+"</h2><p class='lede'>"+L(RF.refi)+"</p><ul class='refl'>";
  RF.refs.forEach(function(r){h+="<li>"+r+"</li>";});
  h+="</ul>";
  h+="<button class='btn ghost' data-go='home'>"+L(UI.home)+"</button>";
  return h;
}

/* ============================================================
   EVENTI
   ============================================================ */
function captureT0(){
  var c=document.getElementById("conf"); if(c) S.t0.conf=parseInt(c.value,10);
  var w=document.getElementById("wt");   if(w) S.t0.wt=parseInt(w.value,10);
  var y=document.getElementById("why");  if(y) S.t0.why=y.value;
}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(el){
    el.onclick=function(e){e.preventDefault();go(el.getAttribute("data-go"));};
  });
  var sd=document.getElementById("setday");
  if(sd) sd.onclick=function(){
    var v=parseInt(document.getElementById("day").value,10);
    if(!(v>=1&&v<=31)) return;
    S.day=null; S.cond=(v%2===0)?"B":"A"; save(); render();
  };
  ["conf","wt"].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.oninput=function(){document.getElementById(id+"v").textContent=el.value;};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"),function(el){
    el.onclick=function(){captureT0();S.t0.pick=el.getAttribute("data-pick");save();render();};
  });
  var t0s=document.getElementById("t0save");
  if(t0s) t0s.onclick=function(){
    if(!S.t0.pick){document.getElementById("t0msg").textContent=(S.lang==="it"?"Scegli un candidato.":"Choose a candidate.");return;}
    S.t0.conf=parseInt(document.getElementById("conf").value,10);
    var w=document.getElementById("wt"); if(w) S.t0.wt=parseInt(w.value,10);
    S.t0.why=document.getElementById("why").value; save();
    document.getElementById("t0msg").textContent=L(T0.saved);
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-lk]"),function(el){
    el.onclick=function(){S.t1[el.getAttribute("data-lk")]=parseInt(el.getAttribute("data-v"),10);save();render();};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-pair]"),function(el){
    el.onclick=function(){S.sa[el.getAttribute("data-pair")]=el.getAttribute("data-d");save();render();};
  });
  var u=document.getElementById("undo");
  if(u) u.onclick=function(){delete S.sa[Object.keys(S.sa).length-1];save();render();};
  var rd=document.getElementById("redo");
  if(rd) rd.onclick=function(){S.sa={};save();render();};
  Array.prototype.forEach.call(document.querySelectorAll("[data-q2]"),function(el){
    el.onclick=function(){
      var q=el.getAttribute("data-q2"); if(S.sb[q]!=null) return;
      S.sb[q]=parseInt(el.getAttribute("data-oi"),10);save();render();};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sc]"),function(el){
    el.onclick=function(){
      S.sc[el.getAttribute("data-sc")]=parseInt(el.getAttribute("data-v"),10);
      save(); render();};
  });
  var og=document.getElementById("opengate");
  if(og) og.onclick=function(){S.t2open=true;save();render();};
  Array.prototype.forEach.call(document.querySelectorAll("[data-t3]"),function(el){
    el.oninput=function(){
      var i=el.getAttribute("data-t3"),f=el.getAttribute("data-f");
      if(!S.t3[i]) S.t3[i]={};
      S.t3[i][f]=el.value; save();};
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-mark]"),function(el){
    el.onclick=function(){
      var i=el.getAttribute("data-mark");
      S.t3pick=(S.t3pick===i)?null:i; save(); render();};
  });
  var c3=document.getElementById("copy3");
  if(c3) c3.onclick=function(){
    var order=[0,1,2];
    if(S.t3pick!=null) order=[parseInt(S.t3pick,10)].concat([0,1,2].filter(function(x){return x!==parseInt(S.t3pick,10);}));
    var txt=L(UI.title)+" — "+L(SEC[4].n)+"\n\n";
    order.forEach(function(i){
      var v=S.t3[i]||{};
      txt+=(String(i)===S.t3pick?"★ ":"")+L(T3.items[i].t)+"\n"+
           L(T3.fq)+": "+(v.q||"—")+"\n"+L(T3.fa)+": "+(v.a||"—")+"\n\n";
    });
    txt+=(S.lang==="it"
      ? "Incolla la riga «Quando» come nota nel calendario, alla data indicata."
      : "Paste the \"When\" line as a calendar note, on the date given.")+"\n";
    var m=document.getElementById("cmsg");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){m.textContent=L(T3.copied);},
        function(){m.textContent=L(T3.nocopy);});
    } else m.textContent=L(T3.nocopy);
  };
}

document.documentElement.lang=S.lang;
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
</script>
